name: Build and publish website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: website/tools/example-check/go.mod
          cache-dependency-path: website/tools/example-check/go.sum
      - run: python -m pip install -r requirements.txt ruff==0.11.13
      - run: make check check/examples
      - name: Check imported specification
        run: |
          make generate/specification
          git diff --exit-code -- docs/specification.md
      - run: mkdocs build --strict

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Check publication revision
        id: revision
        run: |
          git fetch origin main
          if [ "$GITHUB_SHA" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to gh-pages
        if: steps.revision.outputs.current == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdocs gh-deploy --strict --remote-branch gh-pages
      - name: Request GitHub Pages build
        if: steps.revision.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
